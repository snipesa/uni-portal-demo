name: Deploy Orchestrator

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      run_lambda:
        description: "Force run Lambda packaging"
        required: true
        default: false
        type: boolean
      run_infra:
        description: "Force run Terraform deploy"
        required: true
        default: false
        type: boolean
      run_frontend:
        description: "Force run frontend deploy"
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_PROJECT_NAME: ${{ vars.TF_PROJECT_NAME }}
  TF_ENVIRONMENT: ${{ vars.TF_ENVIRONMENT }}
  TF_AWS_REGION: ${{ vars.TF_AWS_REGION }}
  TF_OPERATIONS_BUCKET_NAME: ${{ vars.TF_OPERATIONS_BUCKET_NAME }}
  TF_LAMBDA_ARTIFACT_PREFIX: ${{ vars.TF_LAMBDA_ARTIFACT_PREFIX }}
  TF_FRONTEND_ARTIFACT_PREFIX: ${{ vars.TF_FRONTEND_ARTIFACT_PREFIX }}
  TF_FRONTEND_CALLBACK_URL: ${{ vars.TF_FRONTEND_CALLBACK_URL }}
  TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
  TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY }}
  TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION }}
  TF_BACKEND_DDB_TABLE: ${{ vars.TF_BACKEND_DDB_TABLE }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      lambda_changed: ${{ steps.filter.outputs.lambda }}
      infra_changed: ${{ steps.filter.outputs.infra }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      target_env: ${{ steps.target.outputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "target_env=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lambda:
              - 'src/lambda/rest-api/**'
              - 'infrastructure/scripts/package-lambda.sh'
            infra:
              - 'infrastructure/terraform/**'
              - 'infrastructure/scripts/deploy-infra.sh'
              - 'infrastructure/scripts/package-lambda.sh'
            frontend:
              - 'frontend-website/**'
              - 'infrastructure/scripts/deploy-frontend.sh'
              - 'infrastructure/terraform/root/outputs.tf'
              - 'infrastructure/terraform/modules/amplify/**'
              - 'infrastructure/terraform/modules/cognito/**'

  package_lambda:
    name: Package Lambda
    runs-on: ubuntu-latest
    needs: changes
    environment: ${{ needs.changes.outputs.target_env }}
    concurrency:
      group: deploy-orchestrator-${{ github.ref_name }}-${{ needs.changes.outputs.target_env }}
      cancel-in-progress: false
    if: ${{ needs.changes.outputs.lambda_changed == 'true' || needs.changes.outputs.infra_changed == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_lambda == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render backend and tfvars config files
        working-directory: infrastructure/terraform/root
        run: |
          : "${TF_PROJECT_NAME:?Missing vars.TF_PROJECT_NAME}"
          : "${TF_ENVIRONMENT:?Missing vars.TF_ENVIRONMENT}"
          : "${TF_AWS_REGION:?Missing vars.TF_AWS_REGION}"
          : "${TF_OPERATIONS_BUCKET_NAME:?Missing vars.TF_OPERATIONS_BUCKET_NAME}"
          : "${TF_LAMBDA_ARTIFACT_PREFIX:?Missing vars.TF_LAMBDA_ARTIFACT_PREFIX}"
          : "${TF_FRONTEND_ARTIFACT_PREFIX:?Missing vars.TF_FRONTEND_ARTIFACT_PREFIX}"
          : "${TF_FRONTEND_CALLBACK_URL:?Missing vars.TF_FRONTEND_CALLBACK_URL}"
          : "${TF_BACKEND_BUCKET:?Missing vars.TF_BACKEND_BUCKET}"
          : "${TF_BACKEND_KEY:?Missing vars.TF_BACKEND_KEY}"
          : "${TF_BACKEND_REGION:?Missing vars.TF_BACKEND_REGION}"
          : "${TF_BACKEND_DDB_TABLE:?Missing vars.TF_BACKEND_DDB_TABLE}"

          cat > backend.hcl <<EOF
          bucket         = "${TF_BACKEND_BUCKET}"
          key            = "${TF_BACKEND_KEY}"
          region         = "${TF_BACKEND_REGION}"
          dynamodb_table = "${TF_BACKEND_DDB_TABLE}"
          encrypt        = true
          EOF

          cat > terraform.tfvars <<EOF
          project_name             = "${TF_PROJECT_NAME}"
          environment              = "${TF_ENVIRONMENT}"
          aws_region               = "${TF_AWS_REGION}"
          operations_bucket_name   = "${TF_OPERATIONS_BUCKET_NAME}"
          lambda_artifact_prefix   = "${TF_LAMBDA_ARTIFACT_PREFIX}"
          frontend_artifact_prefix = "${TF_FRONTEND_ARTIFACT_PREFIX}"
          frontend_callback_url    = "${TF_FRONTEND_CALLBACK_URL}"
          EOF

      - name: Package Lambda artifact
        working-directory: infrastructure/scripts
        run: ./package-lambda.sh -e "${{ needs.changes.outputs.target_env }}"

  deploy_infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [changes, package_lambda]
    environment: ${{ needs.changes.outputs.target_env }}
    concurrency:
      group: deploy-orchestrator-${{ github.ref_name }}-${{ needs.changes.outputs.target_env }}
      cancel-in-progress: false
    if: ${{ always() && (needs.package_lambda.result == 'success' || needs.package_lambda.result == 'skipped') && (needs.changes.outputs.infra_changed == 'true' || needs.changes.outputs.lambda_changed == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_infra == 'true')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render backend and tfvars config files
        working-directory: infrastructure/terraform/root
        run: |
          : "${TF_PROJECT_NAME:?Missing vars.TF_PROJECT_NAME}"
          : "${TF_ENVIRONMENT:?Missing vars.TF_ENVIRONMENT}"
          : "${TF_AWS_REGION:?Missing vars.TF_AWS_REGION}"
          : "${TF_OPERATIONS_BUCKET_NAME:?Missing vars.TF_OPERATIONS_BUCKET_NAME}"
          : "${TF_LAMBDA_ARTIFACT_PREFIX:?Missing vars.TF_LAMBDA_ARTIFACT_PREFIX}"
          : "${TF_FRONTEND_ARTIFACT_PREFIX:?Missing vars.TF_FRONTEND_ARTIFACT_PREFIX}"
          : "${TF_FRONTEND_CALLBACK_URL:?Missing vars.TF_FRONTEND_CALLBACK_URL}"
          : "${TF_BACKEND_BUCKET:?Missing vars.TF_BACKEND_BUCKET}"
          : "${TF_BACKEND_KEY:?Missing vars.TF_BACKEND_KEY}"
          : "${TF_BACKEND_REGION:?Missing vars.TF_BACKEND_REGION}"
          : "${TF_BACKEND_DDB_TABLE:?Missing vars.TF_BACKEND_DDB_TABLE}"

          cat > backend.hcl <<EOF
          bucket         = "${TF_BACKEND_BUCKET}"
          key            = "${TF_BACKEND_KEY}"
          region         = "${TF_BACKEND_REGION}"
          dynamodb_table = "${TF_BACKEND_DDB_TABLE}"
          encrypt        = true
          EOF

          cat > terraform.tfvars <<EOF
          project_name             = "${TF_PROJECT_NAME}"
          environment              = "${TF_ENVIRONMENT}"
          aws_region               = "${TF_AWS_REGION}"
          operations_bucket_name   = "${TF_OPERATIONS_BUCKET_NAME}"
          lambda_artifact_prefix   = "${TF_LAMBDA_ARTIFACT_PREFIX}"
          frontend_artifact_prefix = "${TF_FRONTEND_ARTIFACT_PREFIX}"
          frontend_callback_url    = "${TF_FRONTEND_CALLBACK_URL}"
          EOF

      - name: Deploy infrastructure
        working-directory: infrastructure/scripts
        run: ./deploy-infra.sh -e "${{ needs.changes.outputs.target_env }}" --deploy

  deploy_frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [changes, deploy_infra]
    environment: ${{ needs.changes.outputs.target_env }}
    concurrency:
      group: deploy-orchestrator-${{ github.ref_name }}-${{ needs.changes.outputs.target_env }}
      cancel-in-progress: false
    if: ${{ always() && (needs.deploy_infra.result == 'success' || needs.deploy_infra.result == 'skipped') && (needs.changes.outputs.frontend_changed == 'true' || needs.changes.outputs.infra_changed == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_frontend == 'true')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render backend and tfvars config files
        working-directory: infrastructure/terraform/root
        run: |
          : "${TF_PROJECT_NAME:?Missing vars.TF_PROJECT_NAME}"
          : "${TF_ENVIRONMENT:?Missing vars.TF_ENVIRONMENT}"
          : "${TF_AWS_REGION:?Missing vars.TF_AWS_REGION}"
          : "${TF_OPERATIONS_BUCKET_NAME:?Missing vars.TF_OPERATIONS_BUCKET_NAME}"
          : "${TF_LAMBDA_ARTIFACT_PREFIX:?Missing vars.TF_LAMBDA_ARTIFACT_PREFIX}"
          : "${TF_FRONTEND_ARTIFACT_PREFIX:?Missing vars.TF_FRONTEND_ARTIFACT_PREFIX}"
          : "${TF_FRONTEND_CALLBACK_URL:?Missing vars.TF_FRONTEND_CALLBACK_URL}"
          : "${TF_BACKEND_BUCKET:?Missing vars.TF_BACKEND_BUCKET}"
          : "${TF_BACKEND_KEY:?Missing vars.TF_BACKEND_KEY}"
          : "${TF_BACKEND_REGION:?Missing vars.TF_BACKEND_REGION}"
          : "${TF_BACKEND_DDB_TABLE:?Missing vars.TF_BACKEND_DDB_TABLE}"

          cat > backend.hcl <<EOF
          bucket         = "${TF_BACKEND_BUCKET}"
          key            = "${TF_BACKEND_KEY}"
          region         = "${TF_BACKEND_REGION}"
          dynamodb_table = "${TF_BACKEND_DDB_TABLE}"
          encrypt        = true
          EOF

          cat > terraform.tfvars <<EOF
          project_name             = "${TF_PROJECT_NAME}"
          environment              = "${TF_ENVIRONMENT}"
          aws_region               = "${TF_AWS_REGION}"
          operations_bucket_name   = "${TF_OPERATIONS_BUCKET_NAME}"
          lambda_artifact_prefix   = "${TF_LAMBDA_ARTIFACT_PREFIX}"
          frontend_artifact_prefix = "${TF_FRONTEND_ARTIFACT_PREFIX}"
          frontend_callback_url    = "${TF_FRONTEND_CALLBACK_URL}"
          EOF

      - name: Deploy frontend
        working-directory: infrastructure/scripts
        run: ./deploy-frontend.sh -e "${{ needs.changes.outputs.target_env }}"
